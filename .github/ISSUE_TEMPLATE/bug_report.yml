name: Bug Report
description: Report a bug, crash, or unexpected chatbot behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: query
    attributes:
      label: Query Input
      description: What exact prompt was entered into the chatbot?
      placeholder: e.g. "What is stemming?"
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment Info
      placeholder: e.g. Python 3.11 on macOS Sonoma
